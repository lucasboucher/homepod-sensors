services:
  homepod-sensors:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_ENDPOINT_URL: ${HTTP_ENDPOINT_URL}
      PAIRING_FILE: /app/pairing.json
      ROOMS_FILE: /app/rooms.json
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-600}
      HOMEKIT_TIMEOUT_SECONDS: ${HOMEKIT_TIMEOUT_SECONDS:-15}
      HOMEKIT_ATTEMPT_DEADLINE_SECONDS: ${HOMEKIT_ATTEMPT_DEADLINE_SECONDS:-45}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-10}
      HEARTBEAT_FILE: ${HEARTBEAT_FILE:-/tmp/homepod-collector-heartbeat}
      HEARTBEAT_MAX_AGE_SECONDS: ${HEARTBEAT_MAX_AGE_SECONDS:-1800}
    volumes:
      - ${PAIRING_FILE_HOST}:/app/pairing.json:rw
      - ${ROOMS_FILE_HOST}:/app/rooms.json:ro
